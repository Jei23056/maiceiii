  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; background: #2b1f3a; touch-action: manipulation;
               user-select: none; -webkit-user-select: none; font-family: 'Gochi', 'Comic Sans MS', cursive; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  .capa { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; padding: 0 16px; }
  .oculto { opacity: 0; transition: opacity .5s; }
  .visto { opacity: 1; }

  #titulo { top: 6vh; color: #fff6e9; line-height: 1; transform: rotate(-3deg);
            text-shadow: 3px 3px 0 #2b1f3a, -2px -2px 0 #2b1f3a, 2px -2px 0 #2b1f3a, -2px 2px 0 #2b1f3a, 5px 6px 0 #e8577e; }
  #titulo span { display: block; }
  #titulo .a { font-size: clamp(34px, 9.5vw, 70px); }
  #titulo .b { font-size: clamp(56px, 16vw, 120px); color: #ffd35c; }

  #indicacion { bottom: max(7vh, 34px); }
  #indicacion span { display: inline-block; background: #fff6e9; color: #2b1f3a; font-size: clamp(19px, 5vw, 26px);
                     padding: 6px 16px 8px; border: 3px solid #2b1f3a; border-radius: 14px; box-shadow: 4px 4px 0 #2b1f3a;
                     transform: rotate(-1.5deg); }
  #indicacion.visto span { animation: salta .9s ease-in-out infinite; }
  @keyframes salta { 50% { transform: rotate(-1.5deg) translateY(-5px); } }

  #nota { bottom: max(4vh, 18px); }
  #nota div { display: inline-block; position: relative; background: #fff6e9; color: #2b1f3a; font-size: clamp(26px, 7vw, 40px);
              padding: 14px 26px 16px; border: 3px solid #2b1f3a; box-shadow: 5px 5px 0 #2b1f3a; transform: rotate(2deg); }
  #nota div::before { content: ''; position: absolute; top: -14px; left: 50%; margin-left: -40px; width: 80px; height: 24px;
                      background: rgba(255,211,92,.8); transform: rotate(-4deg); }

  #globo { position: fixed; left: 0; top: 0; background: #fff; color: #2b1f3a; font-size: clamp(22px, 6vw, 32px);
           padding: 6px 16px 8px; border: 3px solid #2b1f3a; border-radius: 18px; box-shadow: 3px 3px 0 #2b1f3a;
           white-space: nowrap; pointer-events: none; opacity: 0; }
  #globo.visto { opacity: 1; }

  #repetir { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; font: 20px 'Gochi', 'Comic Sans MS', cursive;
             color: #2b1f3a; background: #ffd35c; border: 3px solid #2b1f3a; border-radius: 12px; padding: 4px 14px 6px;
             box-shadow: 3px 3px 0 #2b1f3a; cursor: pointer; }
  #comer { position: fixed; left: 50%; bottom: max(7vh, 34px); transform: translateX(-50%) rotate(-2deg);
           font: clamp(22px, 6vw, 30px) 'Gochi', 'Comic Sans MS', cursive; color: #2b1f3a; background: #ffd35c;
           border: 3px solid #2b1f3a; border-radius: 16px; padding: 8px 26px 10px; box-shadow: 4px 4px 0 #2b1f3a; cursor: pointer; }
  #comer.visto { animation: brinca .9s ease-in-out infinite; }
  @keyframes brinca { 50% { transform: translateX(-50%) rotate(-2deg) translateY(-5px); } }
  #comer:not(.visto) { pointer-events: none; }
  #comer:active { box-shadow: 1px 1px 0 #2b1f3a; }
  #repetir:not(.visto) { pointer-events: none; }
  #repetir:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #2b1f3a; }
</style>

<body>
<canvas id="c"></canvas>
<h1 id="titulo" class="capa oculto"><span class="a">feliz cumple,</span><span class="b">Marcela</span></h1>
<p id="indicacion" class="capa oculto"><span></span></p>
<div id="nota" class="capa oculto"><div></div></div>
<div id="globo"></div>
<button id="repetir" class="oculto">otra vez</button>
<button id="comer" class="oculto">comer un poco</button>

<script>
/* =============  TEXTOS (cámbialos aquí)  ============= */
const NOMBRE = 'Marcela';
const T = {
  inicio:  'toca la pantalla',
  regalo:  'hay un regalo... ábrelo',
  deseo:   'pide un deseo y toca para soplar las velas',
  fuegos:  'toca la pantalla para que salgan más fuegos artificiales',
  danado:  'velo ahí, lo dañaste',
  comer:   'comer un poco',
  ladron:  '¡muerta de hambre!',
  nota:    'feliz cumple, muerta de hambre'
};
const TOQUES_PARA_DANAR = 6;   // más de 5 toques y explotan los globos

/* =============  BASE  ============= */
const C = document.getElementById('c'), x = C.getContext('2d');
const $ = id => document.getElementById(id);
const ind = $('indicacion'), titulo = $('titulo'), nota = $('nota'), globoTxt = $('globo'), repetir = $('repetir'), bComer = $('comer');
bComer.textContent = 'comer un poco';
titulo.querySelector('.b').textContent = NOMBRE;
nota.firstElementChild.textContent = T.nota;

let W, H, S, DPR;
function ajustar() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight; S = Math.min(W, H * (W > H ? .6 : .78));
  C.width = W * DPR; C.height = H * DPR; x.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', ajustar); ajustar();

const rnd = (a, b) => a + Math.random() * (b - a);
const elegir = a => a[Math.floor(Math.random() * a.length)];
const lim = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const salida = t => 1 - Math.pow(1 - t, 3);
const suave = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
const rebote = t => { const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const TINTA = '#2b1f3a';
function decir(t) { ind.firstElementChild.textContent = t; ind.classList.add('visto'); }
function callar() { ind.classList.remove('visto'); }
function trazo(w) { x.lineWidth = w || Math.max(2, S * .006); x.strokeStyle = TINTA; x.lineJoin = 'round'; x.lineCap = 'round'; x.stroke(); }
function circ(cx, cy, r, col, borde) { x.beginPath(); x.arc(cx, cy, Math.max(0, r), 0, 6.2832); if (col) { x.fillStyle = col; x.fill(); } if (borde) trazo(borde === true ? 0 : borde); }
function rr(px, py, w, h, r) { x.beginPath(); x.moveTo(px + r, py); x.arcTo(px + w, py, px + w, py + h, r); x.arcTo(px + w, py + h, px, py + h, r); x.arcTo(px, py + h, px, py, r); x.arcTo(px, py, px + w, py, r); x.closePath(); }

/* =============  SONIDOS  ============= */
let AC = null, master = null;
function audio() {
  if (!AC) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; AC = new A(); master = AC.createGain(); master.gain.value = .5; master.connect(AC.destination); }
  if (AC.state === 'suspended') AC.resume();
}
function nota1(f, t0, dur, vol = .18, tipo = 'triangle', f2) {
  if (!AC) return; const t = AC.currentTime + t0, o = AC.createOscillator(), g = AC.createGain();
  o.type = tipo; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
function ruido(t0, dur, vol, desde, hasta, tipo = 'bandpass') {
  if (!AC) return; const n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain(), t = AC.currentTime + t0;
  s.buffer = b; f.type = tipo; f.frequency.setValueAtTime(desde, t); f.frequency.exponentialRampToValueAtTime(hasta, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
const F = n => 440 * Math.pow(2, (n - 69) / 12);
const SON = {
  pop:    () => nota1(600, 0, .08, .25, 'square', 120),
  abrir:  () => [72, 76, 79, 84].forEach((n, i) => nota1(F(n), i * .07, .4, .14, 'square')),
  soplo:  () => ruido(0, .8, .5, 2400, 400),
  cohete: () => ruido(0, .45, .1, 500, 3000),
  pum:    () => { ruido(0, .6, .3, 900, 100); nota1(80, 0, .25, .2, 'sine', 40); },
  globo:  i  => { ruido(i * .09, .25, .6, 3000, 600, 'highpass'); nota1(900, i * .09, .05, .2, 'square', 200); },
  boom:   () => { ruido(.2, 1.4, .9, 700, 60, 'lowpass'); nota1(90, .2, .7, .45, 'sine', 30); },
  splat:  () => { ruido(0, .35, .6, 400, 120, 'lowpass'); nota1(160, 0, .2, .3, 'sine', 60); },
  triste: () => [67, 66, 65, 64].forEach((n, i) => nota1(F(n), .9 + i * .35, i === 3 ? .9 : .3, .16, 'triangle')),
  pasos:  () => { for (let i = 0; i < 10; i++) nota1(i % 2 ? 180 : 140, i * .1, .05, .12, 'square'); },
  risa:   () => [76, 79, 76, 79, 76, 83].forEach((n, i) => nota1(F(n), i * .09, .08, .14, 'square')),
  // "Cumpleaños feliz" (melodía tradicional, de dominio público)
  cancion: () => {

let ultPum = 0, ultCohete = 0;

let estrellas = [], globos = [], parts = [], cohetes = [], confeti = [], humo = [], trozos = [];
let velas = true, danio = 0, pastelX = 0, pastelRobado = false;

function ir(e) {
  estado = e; tE = ahora;
  if (e === 'inicio') decir(T.inicio);
  if (e === 'regalo') decir(T.regalo);
  if (e === 'pastel') { callar(); SON.abrir(); for (let i = 0; i < 40; i++) confeti.push(nuevoConfeti(W / 2 + rnd(-40, 40), H * .55, true)); }
  if (e === 'deseo')  decir(T.deseo);
  if (e === 'fiesta') { callar(); velas = false; SON.soplo(); for (const v of posVelas()) for (let i = 0; i < 6; i++) humo.push({ x: v.x, y: v.y, vx: rnd(-8, 8), vy: rnd(-40, -20), r: rnd(3, 6), vida: 0, max: rnd(1.6, 2.4), c: '#d8d0e0' }); }
  if (e === 'danado') { callar(); bComer.classList.remove('visto'); SON.boom(); globos.forEach((g, i) => { g.explota = ahora + i * .09; SON.globo(i); }); }
  if (e === 'ladron') { callar(); bComer.classList.remove('visto'); SON.pasos(); }
}
function reiniciar() {
  estrellas = Array.from({ length: Math.round(W * H / 5000) }, () => ({ x: Math.random(), y: Math.random() * .7, r: rnd(.8, 2), f: rnd(0, 6.28) }));
  globos = []; parts = []; cohetes = []; confeti = []; humo = []; trozos = [];
  velas = true; danio = 0; toques = 0; pastelX = 0; pastelRobado = false;
  [titulo, nota, repetir, globoTxt, bComer].forEach(e => e.classList.remove('visto'));
  for (let i = 0; i < 6; i++) globos.push(nuevoGlobo(rnd(.2, .9) * H));
  ir('inicio');
}

function tocaPastel(px, py) {
  const p = geom();
  return Math.abs(px - p.cx) < p.w1 * .6 && py > p.base - p.h1 - p.h2 - S * .22 && py < p.base + S * .05;
}
C.addEventListener('pointerdown', ev => {
  audio();
  const te = ahora - tE, px = ev.clientX, py = ev.clientY;
  if (estado === 'inicio') { SON.pop(); ir('regalo'); }
  else if (estado === 'regalo' && te > .6) ir('pastel');
  else if (estado === 'deseo' && te > .4) ir('fiesta');
  else if ((estado === 'fiesta' || estado === 'comer') && tFuegos && ahora > tFuegos) {
    toques++;
    for (let i = 0; i < 14; i++) lanzar(px + rnd(-.35, .35) * W, py + rnd(-.18, .18) * H, i * .05);

repetir.addEventListener('click', () => { audio(); SON.pop(); reiniciar(); });
bComer.addEventListener('click', ev => { ev.stopPropagation(); audio(); if (estado === 'comer') { SON.pop(); ir('ladron'); } });

/* =============  FONDO  ============= */
function fondo() {
  const g = x.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#231a33'); g.addColorStop(.7, '#3d2a52'); g.addColorStop(1, '#5a3a5e');
  x.fillStyle = g; x.fillRect(0, 0, W, H);
  // estrellas como crucecitas dibujadas
  x.strokeStyle = '#fff6e9'; x.lineCap = 'round';
  for (const e of estrellas) {
    const t = .4 + .6 * Math.abs(Math.sin(ahora * 1.2 + e.f)), r = e.r * (e.r > 1.6 ? 2.2 : 1);
    x.globalAlpha = t; x.lineWidth = 1.2;
    if (e.r > 1.6) { x.beginPath(); x.moveTo(e.x * W - r, e.y * H); x.lineTo(e.x * W + r, e.y * H); x.moveTo(e.x * W, e.y * H - r); x.lineTo(e.x * W, e.y * H + r); x.stroke(); }
    else { x.fillStyle = '#fff6e9'; x.fillRect(e.x * W, e.y * H, r, r); }
  }
  x.globalAlpha = 1;
  // luna
  const lx = W * .84, ly = H * (W > H ? .13 : .25), lr = Math.min(W, H) * (W > H ? .06 : .05);
  circ(lx, ly, lr, '#fff1c9', true); circ(lx + lr * .35, ly - lr * .2, lr * .82, '#231a33');
  // guirnalda de banderitas
  const cols = ['#e8577e', '#ffd35c', '#5fc4c4', '#a98bd6', '#fff6e9'];
  for (const [y0, cae] of [[H * .02, H * .07]]) {
    x.beginPath(); x.moveTo(-10, y0); x.quadraticCurveTo(W / 2, y0 + cae * 2, W + 10, y0); trazo(2);
    const n = Math.max(8, Math.round(W / 46));
    for (let i = 1; i < n; i++) {
      const t = i / n, bx = (1 - t) * (1 - t) * -10 + 2 * (1 - t) * t * W / 2 + t * t * (W + 10), by = (1 - t) * (1 - t) * y0 + 2 * (1 - t) * t * (y0 + cae * 2) + t * t * y0;
      const s = Math.min(18, W / 30), sw = Math.sin(ahora * 2 + i) * .08;
      x.save(); x.translate(bx, by); x.rotate(sw);
      x.beginPath(); x.moveTo(-s * .6, 0); x.lineTo(s * .6, 0); x.lineTo(0, s * 1.3); x.closePath(); x.fillStyle = cols[i % cols.length]; x.fill(); trazo(2);
      x.restore();
    }
  }
  // mesa
  const yb = H * .72;
  x.fillStyle = '#7a4b3a'; x.fillRect(0, yb, W, H - yb);
  x.fillStyle = '#8c5a46'; x.fillRect(0, yb, W, S * .03);
  x.beginPath(); x.moveTo(0, yb); x.lineTo(W, yb); trazo(3);
  x.strokeStyle = 'rgba(43,31,58,.25)'; x.lineWidth = 2;
  for (let i = 1; i < 4; i++) { x.beginPath(); x.moveTo(0, yb + (H - yb) * i / 4); x.lineTo(W, yb + (H - yb) * i / 4); x.stroke(); }
}

function nuevoGlobo(y) { return { x: rnd(.06, .94) * W, y: y ?? H + 60, r: rnd(.05, .075) * S, v: rnd(25, 50), c: elegir(['#e8577e', '#ffd35c', '#5fc4c4', '#a98bd6', '#7cc77c', '#ff9a5c']), f: rnd(0, 6.28), explota: 0 }; }
function dibujarGlobo(g) {
  const gx = g.x + Math.sin(ahora * 1.2 + g.f) * 7, gy = g.y, r = g.r;
  x.beginPath(); x.moveTo(gx, gy + r * 1.12); x.bezierCurveTo(gx - 9, gy + r * 1.8, gx + 9, gy + r * 2.4, gx, gy + r * 3.2); trazo(1.5);
  x.beginPath(); x.ellipse(gx, gy, r * .85, r, 0, 0, 6.2832); x.fillStyle = g.c; x.fill(); trazo();
  x.beginPath(); x.moveTo(gx - r * .13, gy + r * 1.13); x.lineTo(gx + r * .13, gy + r * 1.13); x.lineTo(gx, gy + r * .98); x.closePath(); x.fill(); trazo(1.5);
  x.beginPath(); x.ellipse(gx - r * .35, gy - r * .4, r * .1, r * .2, -.5, 0, 6.2832); x.fillStyle = 'rgba(255,255,255,.6)'; x.fill();

  for (let i = 0; i < 6; i++) { const a = rnd(0, 6.28), v = rnd(80, 200); trozos.push({ x: gx, y: g.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 60, rot: rnd(0, 6), vr: rnd(-10, 10), s: g.r * rnd(.25, .45), c: g.c, vida: 0 }); }

/* =============  PASTEL  ============= */
function geom() { const w = S * .56; return { cx: W / 2 + pastelX, base: H * .72, w1: w, h1: S * .15, w2: w * .74, h2: S * .13 }; }

  x.beginPath(); x.moveTo(cx - w / 2, top + h * .6); x.ellipse(cx, top + h * .6, w / 2, e, 0, Math.PI, 0, true); x.lineTo(cx + w / 2, top + h * .72); x.ellipse(cx, top + h * .72, w / 2, e, 0, 0, Math.PI); x.closePath();

function dibujarPastel(sube) {

  const top = p.base - p.h1 - p.h2;
  for (let i = 0; i < 5; i++) { const a = Math.PI * (i + .5) / 5; circ(p.cx - Math.cos(a) * p.w2 * .38, top + Math.sin(a) * p.w2 * .04, S * .017, '#e83a5a', 2); }

function gato(mx, my, dir, corre, carga) {
  const k = S / 260, paso = Math.sin(ahora * 22) * (corre ? 1 : 0);
  x.save(); x.translate(mx, my); x.scale(dir * k, k);
  // cola naranja con rayas
  x.save(); x.translate(-24, -26); x.rotate(-.9 + Math.sin(ahora * 10) * .2);
  x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(-30, -6, -40, -30); trazo(14); 
  x.beginPath(); x.moveTo(0, 0); x.quadraticCurveTo(-30, -6, -40, -30); x.strokeStyle = '#d98a3a'; x.lineWidth = 9; x.stroke();
  x.restore();
  // patas
  for (const [ox, sg] of [[-12, 1], [12, -1]]) { x.beginPath(); x.ellipse(ox + paso * 7 * sg, -4, 8, 5.5, 0, 0, 6.2832); x.fillStyle = '#e09a4c'; x.fill(); trazo(3); }
  // cuerpo con sudadera negra (hace juego con el pasamontañas)
  x.beginPath(); x.ellipse(0, -30, 26, 24, 0, 0, 6.2832); x.fillStyle = '#25212b'; x.fill(); trazo(3);
  x.beginPath(); x.moveTo(-6, -48); x.lineTo(-6, -18); x.strokeStyle = '#3d3846'; x.lineWidth = 2; x.stroke();
  // brazo que agarra el bizcocho
  const bx = 30, by = -40 - (carga ? 16 : 0);
  x.beginPath(); x.moveTo(10, -38); x.lineTo(bx, by); trazo(11);
  x.beginPath(); x.moveTo(10, -38); x.lineTo(bx, by); x.strokeStyle = '#25212b'; x.lineWidth = 7; x.stroke();
  circ(bx, by, 5.5, '#e09a4c', 2.5);
  // cabeza: la foto recortada en círculo, como pegatina
  x.save(); x.translate(10, -76 + Math.abs(paso) * 2.5); x.scale(dir, 1);   // la cara siempre derecha, sin espejo
  circ(0, 0, 37, '#fff6e9'); 
  x.save(); x.beginPath(); x.arc(0, 0, 33, 0, 6.2832); x.clip();
  if (caraLista) x.drawImage(CARA, -36, -38, 72, 72); else { x.fillStyle = '#25212b'; x.fillRect(-36, -36, 72, 72); }
  x.restore();
  x.beginPath(); x.arc(0, 0, 37, 0, 6.2832); trazo(3);
  x.restore();
  x.restore();
}

/* =============  FUEGOS ARTIFICIALES Y CONFETI  ============= */
const PAL = [['#e8577e', '#ffd35c', '#fff6e9'], ['#5fc4c4', '#fff6e9', '#a98bd6'], ['#ffd35c', '#ff9a5c', '#fff6e9'], ['#7cc77c', '#ffd35c', '#fff6e9'], ['#a98bd6', '#e8577e', '#fff6e9']];
function lanzar(tx, ty, espera = 0) {
  tx = lim(tx, W * .06, W * .94); ty = lim(ty, H * .06, H * .55);
  cohetes.push({ x0: tx + rnd(-60, 60), tx, ty, vida: -espera, dur: rnd(.6, .9), cols: elegir(PAL), forma: elegir(['bola', 'bola', 'anillo', 'corazon', 'palmera']) });
}
function explotar(c) {
  if (ahora - ultPum > .07) { ultPum = ahora; SON.pum(); }
  const n = parts.length > 2500 ? 35 : parts.length > 1200 ? 50 : 65;
  for (let i = 0; i < n; i++) {
    let vx, vy, a = 6.2832 * i / n;
    if (c.forma === 'corazon') { const hx = 16 * Math.pow(Math.sin(a), 3), hy = -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a)); vx = hx * 8; vy = hy * 8; }
    else if (c.forma === 'anillo') { vx = Math.cos(a) * 170; vy = Math.sin(a) * 170; }
    else if (c.forma === 'palmera') { a = rnd(0, 6.28); const v = rnd(120, 200); vx = Math.cos(a) * v; vy = Math.sin(a) * v - 40; }
    else { a = rnd(0, 6.28); const v = rnd(40, 230); vx = Math.cos(a) * v; vy = Math.sin(a) * v; }
    const esc = S / 420;
    parts.push({ t: 'chispa', x: c.tx, y: c.ty, vx: vx * esc, vy: vy * esc, g: c.forma === 'palmera' ? 160 : 90, vida: 0, max: rnd(1, 1.6), r: rnd(2, 3.2), c: elegir(c.cols), estela: [] });
  }
}
function nuevoConfeti(px, py, arriba) { return { x: px ?? rnd(0, W), y: py ?? rnd(-H * .5, -10), vx: arriba ? rnd(-200, 200) : rnd(-20, 20), vy: arriba ? rnd(-420, -200) : rnd(60, 140), rot: rnd(0, 6), vr: rnd(-6, 6), w: rnd(6, 10), h: rnd(9, 14), c: elegir(['#e8577e', '#ffd35c', '#5fc4c4', '#a98bd6', '#7cc77c', '#fff6e9']), f: rnd(0, 6) }; }

function particulas(dt) {
  for (const c of cohetes) {
    c.vida += dt; if (c.vida < 0) continue;
    const q = lim(c.vida / c.dur), e = salida(q), px = c.x0 + (c.tx - c.x0) * e, py = H * .75 + (c.ty - H * .75) * e;
    parts.push({ t: 'chispa', x: px, y: py, vx: rnd(-10, 10), vy: rnd(10, 40), g: 40, vida: 0, max: .35, r: 1.8, c: '#ffe9a0' });
    if (q >= 1 && !c.listo) { c.listo = true; explotar(c); }
    if (q < .05 && !c.son) { c.son = true; if (ahora - ultCohete > .09) { ultCohete = ahora; SON.cohete(); } }
  }
  cohetes = cohetes.filter(c => !c.listo);

  for (const p of parts) {
    p.vida += dt; p.vx *= .985; p.vy = p.vy * .985 + p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const a = lim(1 - p.vida / p.max);
    if (p.t === 'fuego') { x.globalAlpha = a; circ(p.x, p.y, p.r * (1 + p.vida * 2), p.c); continue; }
    if (p.estela) { p.estela.push([p.x, p.y]); if (p.estela.length > (parts.length > 1500 ? 3 : 5)) p.estela.shift();
      if (p.estela.length > 1) { x.globalAlpha = a * .5; x.beginPath(); x.moveTo(p.estela[0][0], p.estela[0][1]); for (const [ex, ey] of p.estela) x.lineTo(ex, ey); x.strokeStyle = p.c; x.lineWidth = p.r; x.lineCap = 'round'; x.stroke(); } }
    x.globalAlpha = a; x.fillStyle = p.c; x.fillRect(p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
  }
  x.globalAlpha = 1; parts = parts.filter(p => p.vida < p.max);

  for (const h of humo) { h.vida += dt; h.x += h.vx * dt; h.y += h.vy * dt; h.r += dt * 12; x.globalAlpha = .45 * lim(1 - h.vida / h.max); circ(h.x, h.y, h.r, h.c); }
  x.globalAlpha = 1; humo = humo.filter(h => h.vida < h.max);

  for (const t of trozos) { t.vida += dt; t.vy += 500 * dt; t.x += t.vx * dt; t.y += t.vy * dt; t.rot += t.vr * dt;
    x.save(); x.translate(t.x, t.y); x.rotate(t.rot); x.beginPath(); x.moveTo(-t.s, 0); x.lineTo(0, -t.s * .6); x.lineTo(t.s, t.s * .3); x.closePath(); x.fillStyle = t.c; x.fill(); trazo(1.5); x.restore(); }
  trozos = trozos.filter(t => t.y < H + 40);

  for (const c of confeti) { c.vy = Math.min(c.vy + 300 * dt, 150); c.vx *= .97; c.x += (c.vx + Math.sin(ahora * 2 + c.f) * 30) * dt; c.y += c.vy * dt; c.rot += c.vr * dt;
    x.save(); x.translate(c.x, c.y); x.rotate(c.rot); x.scale(1, Math.cos(ahora * 6 + c.f)); x.fillStyle = c.c; x.fillRect(-c.w / 2, -c.h / 2, c.w, c.h); x.restore(); }
  confeti = confeti.filter(c => c.y < H + 20);
}

/* =============  BUCLE  ============= */
function burbuja(px, py) {
  const w = globoTxt.offsetWidth, h = globoTxt.offsetHeight;
  globoTxt.style.left = lim(px - w / 2, 8, W - w - 8) + 'px'; globoTxt.style.top = (py - h) + 'px';
}
function cuadro(ms) {
  ahora = ms / 1000; const dt = Math.min(.05, ahora - previo || 0); previo = ahora; const te = ahora - tE;
  fondo();

  // globos
  const fiesta = ['fiesta', 'comer', 'ladron'].includes(estado);
  if (estado !== 'danado' && globos.length < (fiesta ? 14 : 7) && Math.random() < dt * (fiesta ? 2.5 : .8)) globos.push(nuevoGlobo());
  for (const g of globos) { if (!g.explota) g.y -= g.v * dt; dibujarGlobo(g); }
  for (const g of globos) if (g.explota && ahora >= g.explota) { explotarGlobo(g); g.muerto = true; }
  globos = globos.filter(g => !g.muerto && g.y > -g.r * 4);

  if (estado === 'regalo') regalo(te);

  const conPastel = ['pastel', 'deseo', 'fiesta', 'comer', 'danado', 'ladron'].includes(estado);
  if (conPastel && !(estado === 'ladron' && pastelRobado && te > 3.2)) {
    if (estado === 'ladron' && pastelRobado) {
      // el mapache se lo lleva: el bizcocho viaja con él
      const q = lim((te - 1.5) / 1.6); pastelX = -q * W * 1.1;
      x.save(); x.translate(geom().cx, H * .72); x.translate(0, -Math.abs(Math.sin(ahora * 22)) * 6 - S * .02); x.translate(-geom().cx, -H * .72);
      dibujarPastel(1); x.restore();
    } else dibujarPastel(estado === 'pastel' ? lim(te / 1.5) : 1);
  }
  if (estado === 'pastel' && te > 1.9) ir('deseo');

  if (estado === 'fiesta') {
    if (te > .6 && !titulo.classList.contains('visto')) { titulo.classList.add('visto'); for (let i = 0; i < 120; i++) confeti.push(nuevoConfeti()); SON.cancion(); }
    if (te > .8 && Math.random() < dt * 6) lanzar(rnd(.08, .92) * W, rnd(.08, .45) * H);
    if (te > 3.5 && !tFuegos) { tFuegos = ahora; decir(T.fuegos); }
    if (tFuegos && ahora - tFuegos > 3.5) { ir('comer'); callar(); bComer.classList.add('visto'); }
  }
  if (estado === 'comer' && Math.random() < dt * 6) lanzar(rnd(.08, .92) * W, rnd(.08, .45) * H);

  if (estado === 'danado') {
    danio = lim((te - .55) / .5);
    if (te > .55 && !ind.dataset.splat) { ind.dataset.splat = 1; SON.splat(); for (let i = 0; i < 10; i++) humo.push({ x: geom().cx + rnd(-1, 1) * S * .2, y: H * .62, vx: rnd(-25, 25), vy: rnd(-50, -20), r: S * .04, vida: 0, max: 2.6, c: '#5b5266' }); SON.triste(); }
    if (te > 1.4 && !ind.classList.contains('visto')) decir(T.danado);
    if (te > 4 && !nota.classList.contains('visto')) { nota.classList.add('visto'); callar(); }
    if (te > 5) repetir.classList.add('visto');
  }

  if (estado === 'ladron') {
    // entra corriendo por la derecha, agarra el bizcocho y sale por la izquierda
    const p = geom(), llegar = lim(te / 1.2), mx0 = W + S * .3, mxL = W / 2 + S * .45;
    let mx, dir = -1, carga = false;
    if (te < 1.2) mx = mx0 + (mxL - mx0) * salida(llegar);
    else if (te < 1.5) mx = mxL;
    else { carga = true; pastelRobado = true; mx = mxL - lim((te - 1.5) / 1.6) * W * 1.1; }
    if (te > 1.2 && !globoTxt.dataset.dicho) { globoTxt.dataset.dicho = 1; globoTxt.textContent = T.ladron; globoTxt.classList.add('visto'); SON.risa(); }
    if (te > 1.5 && te < 1.6 && !globoTxt.dataset.pasos2) { globoTxt.dataset.pasos2 = 1; SON.pasos(); }
    gato(mx, H * .72 + S * .01, dir, te < 1.2 || te > 1.5, carga);
    if (globoTxt.classList.contains('visto')) burbuja(mx, H * .72 - S * .5);
    if (te > 3.4) globoTxt.classList.remove('visto');
    if (te > 3.6 && !nota.classList.contains('visto')) nota.classList.add('visto');
    if (te > 4.6) repetir.classList.add('visto');
    if (te > 3.6 && Math.random() < dt * 4) lanzar(rnd(.08, .92) * W, rnd(.08, .45) * H);
  }

  particulas(dt);
  requestAnimationFrame(cuadro);
}

const _reiniciar = reiniciar;
reiniciar = function () { tFuegos = 0; delete ind.dataset.splat; delete globoTxt.dataset.dicho; delete globoTxt.dataset.pasos2; _reiniciar(); };
reiniciar();
requestAnimationFrame(ms => { ahora = previo = ms / 1000; tE = ahora; requestAnimationFrame(cuadro); });
</script>
